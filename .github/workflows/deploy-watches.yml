name: Deploy Watches Storefront

# Manual deploy for PR Watches weekend launch. After Vercel env vars are set, run from Actions tab.
# When ready for auto-deploy on merge to main:
#   push:
#     branches: [main]
#     paths:
#       - 'watches-store-v2/**'
on:
  workflow_dispatch:

jobs:
  deploy-watches:
    name: Deploy PR Watches Storefront to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build watches storefront
        run: npm run build -w watches-store-v2
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLIENT_SLUG: pr-watches-gadgets
          VITE_CLIENT_ID: client-watches-1

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_WATCHES_PROJECT_ID }}
          working-directory: ./watches-store-v2
          vercel-args: '--prod'
