name: Deploy Liquor Storefront

# Manual deploy. Set Vercel env vars first, then run from Actions tab.
# When ready for auto-deploy on merge to main:
#   push:
#     branches: [main]
#     paths:
#       - 'liquor-store-v1/**'
on:
  workflow_dispatch:

jobs:
  deploy-liquor:
    name: Deploy Liquor Storefront to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build liquor storefront
        run: npm run build -w liquor-store-v1
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLIENT_SLUG: united-liquors
          VITE_CLIENT_ID: client-liquor-1
          VITE_SUPERADMIN_EMAIL: ${{ secrets.VITE_SUPERADMIN_EMAIL }}
          VITE_PRODUCT_IMAGE_UPLOAD_URL: /api/upload-product-image

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_LIQUOR_PROJECT_ID }}
          working-directory: ./liquor-store-v1
          vercel-args: '--prod'
