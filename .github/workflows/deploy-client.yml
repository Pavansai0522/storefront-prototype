name: Deploy Client

# Manual only while you set up. To deploy on every merge to main when client/ changes, add:
#   push:
#     branches: [main]
#     paths:
#       - 'client/**'
on:
  workflow_dispatch:

jobs:
  deploy-client:
    name: Deploy Storefront to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build client
        run: npm run build -w client
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLIENT_SLUG: bala-mobiles
          VITE_CLIENT_ID: client-bala-1
          VITE_SUPERADMIN_EMAIL: ${{ secrets.VITE_SUPERADMIN_EMAIL }}
          VITE_PRODUCT_IMAGE_UPLOAD_URL: /api/upload-product-image

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_CLIENT_PROJECT_ID }}
          working-directory: ./client
          vercel-args: '--prod'
